apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: home-assistant
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: home-assistant
      owner: home-assistant
  storage:
    storageClass: local-path
    size: 8Gi
  resources:
    requests:
      memory: 400Mi
      cpu: 10m
  smartShutdownTimeout: 1
  stopDelay: 300
  postgresql:
    parameters:
      archive_timeout: "0"
      checkpoint_timeout: 30min
  primaryLease:
    leaseDurationSeconds: 60
    renewDeadlineSeconds: 40
    retryPeriodSeconds: 10
