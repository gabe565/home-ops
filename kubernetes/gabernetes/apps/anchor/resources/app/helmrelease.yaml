# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anchor
  namespace: anchor
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      labels:
        policy.gabe565.com/egress-namespace: "true"
        policy.gabe565.com/egress-world: "true"
        policy.gabe565.com/ingress-envoy-public: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}

    controllers:
      anchor:
        annotations:
          secret.reloader.stakater.com/reload: anchor-env,postgresql-app
        initContainers:
          migrate:
            image: &image
              repository: ghcr.io/zhfahim/anchor
              tag: 0.18.0@sha256:434f8b2bc72e32d7027fa0259e565d7f3930cc2eca49f0c5b0b90befb5a45a77
              pullPolicy: IfNotPresent
            workingDir: /app/server
            command: [./node_modules/.bin/prisma, migrate, deploy]
            env: &dbEnv
              DATABASE_URL:
                secretKeyRef:
                  name: postgresql-app
                  key: uri
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        containers:
          api:
            image: *image
            workingDir: /app/server
            command: [node, dist/src/main]
            envFrom:
              - secretRef:
                  name: anchor-env
            env:
              <<: *dbEnv
              TZ: America/Chicago
              PORT: "3001"
              APP_URL: https://${app_url}
              CORS_ORIGINS: https://${app_url}
              USER_SIGNUP: enabled
              DISABLE_INTERNAL_AUTH: "true"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: Pocket ID
              OIDC_ISSUER_URL: https://${oidc_host}
            probes:
              liveness: &apiProbe
                enabled: true
                type: HTTP
                port: 3001
                path: /api/health
              readiness: *apiProbe
              startup:
                <<: *apiProbe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext: *securityContext
          web:
            image: *image
            workingDir: /app/web
            command: [node, server.js]
            env:
              TZ: America/Chicago
              PORT: "3000"
              HOSTNAME: 0.0.0.0
              SERVER_URL: http://127.0.0.1:3001
            probes:
              liveness: &webProbe
                enabled: true
                type: HTTP
                port: 3000
                path: /
              readiness: *webProbe
              startup:
                <<: *webProbe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext: *securityContext

    service:
      anchor:
        controller: anchor
        ports:
          http:
            port: 3000

    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 4Gi
        retain: true
        advancedMounts:
          anchor:
            api:
              - path: /data
      tmp:
        type: emptyDir
        medium: Memory

    route:
      anchor:
        parentRefs:
          - namespace: envoy-gateway-system
            name: public
        hostnames:
          - ${app_url}
