# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: monica
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: mariadb-defaults
  values:
    controllers:
      mariadb:
        containers:
          mariadb:
            image:
              repository: mariadb
              tag: 13.0.2@sha256:0e4bb0f339feba125d1154fbacd36c16ec8518f52e44e1f82ecec7d6771caf39
            env:
              MARIADB_DATABASE: monica
              MARIADB_USER: monica

    persistence:
      data:
        storageClass: longhorn-ssd
        accessMode: ReadWriteOnce
        size: 8Gi
        retain: true

    secrets:
      mariadb:
        stringData:
          mariadb-root-password: ${mariadb_root_password}
          mariadb-password: ${mariadb_password}
