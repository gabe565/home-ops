apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: nocturne
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: nocturne
      owner: nocturne_migrator
      secret:
        name: postgres-migrator
      postInitApplicationSQL:
        - CREATE ROLE nocturne_app LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE
        - CREATE ROLE nocturne_web LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE
        - ALTER SCHEMA public OWNER TO nocturne_migrator
        - GRANT CONNECT ON DATABASE nocturne TO nocturne_app
        - GRANT USAGE ON SCHEMA public TO nocturne_app
        - GRANT CONNECT ON DATABASE nocturne TO nocturne_web
        - GRANT USAGE, CREATE ON SCHEMA public TO nocturne_web
        - ALTER DEFAULT PRIVILEGES FOR ROLE nocturne_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO nocturne_app
        - ALTER DEFAULT PRIVILEGES FOR ROLE nocturne_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO nocturne_app
  managed:
    roles:
      - name: nocturne_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        passwordSecret:
          name: postgres-app
      - name: nocturne_web
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        passwordSecret:
          name: postgres-web
  storage:
    storageClass: local-path
    size: 8Gi
  resources:
    requests:
      memory: 50Mi
      cpu: 20m
  smartShutdownTimeout: 1
  stopDelay: 300
  postgresql:
    parameters:
      archive_timeout: "0"
  primaryLease:
    leaseDurationSeconds: 60
    renewDeadlineSeconds: 40
    retryPeriodSeconds: 10
