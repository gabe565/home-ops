# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      open-webui:
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7
              pullPolicy: IfNotPresent
            env:
              TZ: America/Chicago
              HOME: /nonexistent
              GLOBAL_LOG_LEVEL: WARNING
              WEBUI_SECRET_KEY: ${secret_key}
              CORS_ALLOW_ORIGIN: https://${app_url}
              DATABASE_URL:
                secretKeyRef:
                  name: postgresql-app
                  key: uri
              OPENAI_API_KEY: ${openai_api_key}
              ENABLE_LITELLM: "false"
              ENABLE_LOGIN_FORM: "false"
              WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-User-Email
              WEBUI_AUTH_TRUSTED_NAME_HEADER: X-User-Name
              WEBUI_AUTH_SIGNOUT_REDIRECT_URL: /oauth2/logout
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /health
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          labels:
            policy.gabe565.com/egress-namespace: "true"
            policy.gabe565.com/egress-world: "true"
            policy.gabe565.com/ingress-envoy-public: "true"

    service:
      open-webui:
        controller: open-webui
        ports:
          http:
            port: 8080

    persistence:
      data:
        suffix: data
        storageClass: longhorn-ssd
        accessMode: ReadWriteOnce
        size: 4Gi
        retain: true
        globalMounts:
          - path: /app/backend/data
            subPath: data
          - path: /app/backend/static
            subPath: static
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 128Mi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /nonexistent
            subPath: nonexistent

    route:
      open-webui:
        parentRefs:
          - namespace: envoy-gateway-system
            name: public
        hostnames:
          - ${app_url}
        rules:
          - filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove: [Authorization]
            backendRefs:
              - identifier: open-webui

    rawResources:
      auth:
        manifest:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          spec:
            mergeType: StrategicMerge
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: "{{ .Release.Name }}"
            oidc:
              cookieConfig:
                sameSite: Lax
              provider:
                issuer: https://${oidc_host}
                authorizationEndpoint: https://${oidc_host}/authorize
                tokenEndpoint: https://${oidc_host}/api/oidc/token
                endSessionEndpoint: https://${oidc_host}/api/oidc/end-session
              clientIDRef:
                name: oidc
              clientSecret:
                name: oidc
              scopes: [openid, offline_access, email, profile]
              logoutPath: /oauth2/logout
              forwardIDToken:
                header: Authorization
            jwt:
              providers:
                - name: extract-user-info
                  remoteJWKS:
                    uri: https://${oidc_host}/.well-known/jwks.json
                  claimToHeaders:
                    - claim: email
                      header: X-User-Email
                    - claim: name
                      header: X-User-Name
