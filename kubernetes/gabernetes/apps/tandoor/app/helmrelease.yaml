# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tandoor
  namespace: tandoor
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      tandoor:
        strategy: RollingUpdate
        initContainers:
          collectstatic: &container
            image:
              repository: ghcr.io/tandoorrecipes/recipes
              tag: 2.7.2@sha256:1b6d43c3c0f5d2888aa564d9daf29883212b79ad496f59f3c684c099eb1a57b9
            command: [python, manage.py, collectstatic, --noinput]
            env:
              TZ: America/Chicago
              PATH: /opt/recipes/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              VIRTUAL_ENV: /opt/recipes/venv

              ALLOWED_HOSTS: "*"
              SECRET_KEY: ${secret_key}
              FRACTION_PREF_DEFAULT: "1"
              DEBUG: "0"

              DB_ENGINE: django.db.backends.postgresql
              POSTGRES_HOST: postgresql-rw
              POSTGRES_DB: tandoor
              POSTGRES_USER: tandoor
              POSTGRES_PASSWORD:
                secretKeyRef:
                  name: postgresql-app
                  key: password

              S3_ENDPOINT_URL: ${s3_url}
              S3_ACCESS_KEY: ${s3_access_key}
              S3_SECRET_ACCESS_KEY: ${s3_secret_key}
              S3_BUCKET_NAME: tandoor
              S3_REGION_NAME: us-central-1

              REMOTE_USER_AUTH: "1"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
              readOnlyRootFilesystem: true
          migrate:
            <<: *container
            command: [python, manage.py, migrate]
        containers:
          app:
            <<: *container
            command:
              - gunicorn
              - --bind=0.0.0.0:8080
              - --workers=1
              - --threads=2
              - --timeout=30
              - --error-logfile=-
              - recipes.wsgi
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness:
                enabled: true
              readiness:
                enabled: true

        pod:
          enableServiceLinks: false
          labels:
            policy.gabe565.com/egress-namespace: "true"
            policy.gabe565.com/egress-world: "true"
            policy.gabe565.com/ingress-envoy-public: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}

    service:
      tandoor:
        controller: tandoor
        ports:
          http:
            port: 8080

    persistence:
      static:
        type: emptyDir
        advancedMounts:
          tandoor:
            collectstatic:
              - path: /opt/recipes/staticfiles
            app:
              - path: /opt/recipes/staticfiles
                readOnly: true
      tmp:
        type: emptyDir

    route:
      tandoor:
        parentRefs:
          - namespace: envoy-gateway-system
            name: public
        hostnames:
          - ${app_url}

    rawResources:
      auth:
        manifest:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          spec:
            mergeType: StrategicMerge
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: "{{ .Release.Name }}"
            oidc:
              cookieConfig:
                sameSite: Lax
              provider:
                issuer: https://${oidc_host}
                authorizationEndpoint: https://${oidc_host}/authorize
                tokenEndpoint: https://${oidc_host}/api/oidc/token
                endSessionEndpoint: https://${oidc_host}/api/oidc/end-session
              clientIDRef:
                name: oidc
              clientSecret:
                name: oidc
              scopes: [openid, offline_access, profile]
              logoutPath: /accounts/logout/
              forwardIDToken:
                header: Authorization
            jwt:
              providers:
                - name: extract-user-info
                  remoteJWKS:
                    uri: https://${oidc_host}/.well-known/jwks.json
                  claimToHeaders:
                    - claim: preferred_username
                      header: Remote-User
