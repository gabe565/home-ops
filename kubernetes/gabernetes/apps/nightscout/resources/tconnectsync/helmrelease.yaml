# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tconnectsync
  namespace: nightscout
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      tconnectsync:
        annotations:
          secret.reloader.stakater.com/reload: tconnectsync-env
        strategy: Recreate
        containers:
          tconnectsync:
            image:
              repository: ghcr.io/jwoglom/tconnectsync/tconnectsync
              tag: v3.0.0@sha256:b922b340ffa899830e21754cf720200fa0f4fcd008df272a69c8bb5d5c9f87bb
              pullPolicy: IfNotPresent
            args: ["--auto-update"]
            envFrom:
              - secretRef:
                  name: tconnectsync-env
            env:
              TZ: America/Chicago
              NS_URL: http://nightscout.nightscout:1337
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        pod:
          labels:
            policy.gabe565.com/egress-namespace: "true"
            policy.gabe565.com/egress-world: "true"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}

    persistence:
      config:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /home/appuser/.config
