apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: prometheus
spec:
  chart:
    spec:
      chart: loki
      version: 7.3.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: grafana
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      server:
        log_level: warn
      podLabels:
        policy.gabe565.com/egress-kubeapi: "true"
        policy.gabe565.com/egress-namespace: "true"
        policy.gabe565.com/ingress-namespace: "true"
        policy.gabe565.com/ingress-prometheus: "true"
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 720h # 30d
        volume_enabled: true
        allow_structured_metadata: true
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        ingestion_rate_mb: 32
        ingestion_burst_size_mb: 64
        per_stream_rate_limit: 16MB
        per_stream_rate_limit_burst: 32MB
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
      pattern_ingester:
        enabled: false
      analytics:
        reporting_enabled: false
      ingester:
        chunk_encoding: snappy
      querier:
        max_concurrent: 4

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn-ssd
        size: 50Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false

    monitoring:
      dashboards:
        enabled: true
      rules:
        enabled: true
        configs:
          LokiCanaryLatency:
            enabled: false
      serviceMonitor:
        enabled: true
