# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.0.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: kromgo
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      kromgo:
        annotations:
          configmap.reloader.stakater.com/reload: kromgo-config
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/kromgo
              tag: 0.16.1@sha256:ad39dd32da600ea261112e7a098345d474d48c997790b0373eb651c66e490844
              pullPolicy: IfNotPresent
            env:
              KROMGO_PROMETHEUS_URL: http://kube-prometheus-stack-prometheus:9090
              KROMGO_SERVER_HOST: 0.0.0.0
              KROMGO_METRICS_HOST: 0.0.0.0
            securityContext:
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
                memory: 10Mi
              limits:
                memory: 64Mi
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                port: 8080
                path: /readyz
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
        pod:
          labels:
            policy.gabe565.com/egress-namespace: "true"
            policy.gabe565.com/ingress-envoy-public: "true"

    persistence:
      config:
        type: configMap
        name: kromgo-config
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml

    service:
      kromgo:
        controller: kromgo
        ports:
          http:
            port: 8080
            primary: true
          metrics:
            port: 8081

    route:
      kromgo:
        parentRefs:
          - namespace: envoy-gateway-system
            name: public
        hostnames:
          - kromgo.gabe565.com

    rawResources:
      no-geoblock:
        suffix: no-geoblock
        manifest:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: "{{ .Release.Name }}"
            authorization:
              defaultAction: Allow
