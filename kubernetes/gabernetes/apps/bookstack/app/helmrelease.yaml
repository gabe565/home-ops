# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.2.1/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookstack
  namespace: bookstack
spec:
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      bookstack:
        strategy: RollingUpdate
        containers:
          bookstack:
            image:
              repository: ghcr.io/linuxserver/bookstack
              tag: version-v26.09.2@sha256:da6324232770050b7d5f6222e8f4e223f1c688363b02ebb3c15a7546dd7133d5
              pullPolicy: IfNotPresent
            env:
              TZ: America/Chicago
              APP_URL: https://${app_url}
              APP_KEY: ${app_key}

              DB_HOST: mariadb
              DB_DATABASE: bookstack
              DB_USERNAME: bookstack
              DB_PASSWORD:
                secretKeyRef:
                  name: mariadb
                  key: mariadb-password

              STORAGE_TYPE: s3
              STORAGE_S3_KEY: ${s3_access_key}
              STORAGE_S3_SECRET: ${s3_secret_key}
              STORAGE_S3_BUCKET: bookstack
              STORAGE_S3_REGION: us-central-1
              STORAGE_S3_ENDPOINT: https://${s3_url}
              STORAGE_URL: https://bookstack.${s3_url}

              LOG_FAILED_LOGIN_MESSAGE: Failed login for %u
              AUTH_METHOD: oidc
              AUTH_AUTO_INITIATE: "true"
              OIDC_NAME: Pocket ID
              OIDC_DISPLAY_NAME_CLAIMS: name
              OIDC_EXTERNAL_ID_CLAIM: preferred_username
              OIDC_CLIENT_ID:
                secretKeyRef:
                  name: oidc
                  key: client-id
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: oidc
                  key: client-secret
              OIDC_ISSUER: https://${oidc_host}
              OIDC_ISSUER_DISCOVER: "true"
              OIDC_END_SESSION_ENDPOINT: "true"
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /status
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
        pod:
          labels:
            policy.gabe565.com/egress-envoy-public: "true"
            policy.gabe565.com/egress-namespace: "true"
            policy.gabe565.com/egress-world: "true"
            policy.gabe565.com/ingress-envoy-public: "true"
          securityContext:
            seccompProfile: {type: RuntimeDefault}
          hostAliases:
            - ip: 10.43.0.20
              hostnames:
                - ${oidc_host}

    persistence:
      config:
        type: emptyDir
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /run
            subPath: run

    service:
      bookstack:
        ports:
          http:
            port: 80

    route:
      bookstack:
        parentRefs:
          - namespace: envoy-gateway-system
            name: public
        hostnames:
          - ${app_url}
        rules:
          - backendRefs:
              - identifier: bookstack
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  remove:
                    - Server
                    - X-Powered-By

    rawResources:
      no-geoblock:
        suffix: no-geoblock
        manifest:
          apiVersion: gateway.envoyproxy.io/v1alpha1
          kind: SecurityPolicy
          spec:
            targetRefs:
              - group: gateway.networking.k8s.io
                kind: HTTPRoute
                name: "{{ .Release.Name }}"
            authorization:
              defaultAction: Allow
