# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-5.3.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb
  namespace: bookstack
spec:
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        namespace: flux-system
        name: bjw-s
  interval: 1h
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: mariadb-defaults
  values:
    controllers:
      mariadb:
        containers:
          mariadb:
            image:
              repository: mariadb
              tag: 13.1.2@sha256:b7738e01f283ab4d79d96777a587bb8dc2ad057554a11231e7c8d363a5892e6d
            args:
              - --max_statement_time=60
            env:
              MARIADB_DATABASE: bookstack
              MARIADB_USER: bookstack

    persistence:
      data:
        storageClass: longhorn-ssd
        accessMode: ReadWriteOnce
        size: 8Gi
        retain: true

    secrets:
      mariadb:
        stringData:
          mariadb-root-password: ${mariadb_root_password}
          mariadb-password: ${mariadb_password}
