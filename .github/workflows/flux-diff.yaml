name: "Flux Diff"

on:
  pull_request:
    branches: [main]
    paths: [kubernetes/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: home-operations/flate/action@797c483c107913d3f7757b7d3e1f6bc9179fe43d # v0.6.0
        with:
          base: ${{ github.event.pull_request.base.sha }}
          cache: true

      - name: Generate Diff
        id: diff
        run: |
          flate diff all \
            --path . \
            --allow-missing-secrets \
            --no-progress \
            -o github | tee diff.patch

          {
            echo "added=$(grep -c '^+[^+]' diff.patch || true)"
            echo "removed=$(grep -c '^-[^-]' diff.patch || true)"
          } >> "$GITHUB_OUTPUT"

          if [[ $(wc -c < diff.patch) -gt 60000 ]]; then
            head -c 60000 diff.patch > diff.trunc
            printf '\n... diff truncated, see the workflow log for the full output.\n' >> diff.trunc
            mv diff.trunc diff.patch
          fi

          {
            echo "diff<<FLATE_DIFF_EOF"
            cat diff.patch
            echo "FLATE_DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.diff.outputs.diff != '' || failure() }}
        name: Add comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: ${{ github.event.pull_request.number }}/flux-diff
          message-failure: |
            ## Flux Diff

            > [!CAUTION]
            > Failed to create diff. [View log.](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          message: |
            ## Flux Diff

            <table>
              <tr>
                <td><b>Changes</b></td>
                <td><picture><img alt="+${{ steps.diff.outputs.added }} −${{ steps.diff.outputs.removed }}" src="https://img.shields.io/badge/%2B${{ steps.diff.outputs.added }}-%E2%88%92${{ steps.diff.outputs.removed }}-red?labelColor=brightgreen"></picture></td>
              </tr>
            </table>

            <details>
              <summary>Click to expand</summary>

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
            </details>

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  flux-diff-success:
    name: Flux Diff Successful
    runs-on: ubuntu-24.04
    needs: [flux-diff]
    permissions: {}
    if: ${{ always() }}
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check matrix status
        run: exit 1
